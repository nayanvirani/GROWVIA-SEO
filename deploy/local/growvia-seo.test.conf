# Local Apache vhost: http://growvia-seo.test
<VirtualHost *:80>
    ServerName growvia-seo.test
    DocumentRoot /var/www/html/my/GROWVIA-SEO/public

    <Directory /var/www/html/my/GROWVIA-SEO/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve dotfiles (.env, .git) even if the DocumentRoot changes.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/growvia-seo.test-error.log
    CustomLog ${APACHE_LOG_DIR}/growvia-seo.test-access.log combined
</VirtualHost>
